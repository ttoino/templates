name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  generate-and-check:
    name: Generate and check (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: general
            project_type: general
          - name: python
            project_type: python
            cli: "true"
          - name: hono-worker
            project_type: hono-worker
            tests: "true"
          - name: static-worker
            project_type: static-worker
          - name: rust-binary
            project_type: rust
            crate_type: "binary"
          - name: rust-library
            project_type: rust
            crate_type: "library"
          - name: sveltekit
            project_type: sveltekit
            tailwind: "true"
            svelte_m3c: "false"
            tests: "true"
            browser_tests: "true"
          - name: svelte-library
            project_type: svelte-library
            tailwind: "false"
            tests: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install Copier
        run: pip install copier

      - name: Generate project
        run: |
          DATA_ARGS=(
            "--data" "name=ci-test"
            "--data" "description=CI test project"
            "--data" "project_type=${{ matrix.project_type }}"
          )
          [[ -n "${{ matrix.cli }}" ]] && DATA_ARGS+=("--data" "cli=${{ matrix.cli }}")
          [[ -n "${{ matrix.crate_type }}" ]] && DATA_ARGS+=("--data" "crate_type=${{ matrix.crate_type }}")
          [[ -n "${{ matrix.tailwind }}" ]] && DATA_ARGS+=("--data" "tailwind=${{ matrix.tailwind }}")
          [[ -n "${{ matrix.svelte_m3c }}" ]] && DATA_ARGS+=("--data" "svelte_m3c=${{ matrix.svelte_m3c }}")
          [[ -n "${{ matrix.tests }}" ]] && DATA_ARGS+=("--data" "tests=${{ matrix.tests }}")
          [[ -n "${{ matrix.browser_tests }}" ]] && DATA_ARGS+=("--data" "browser_tests=${{ matrix.browser_tests }}")
          copier copy --trust --defaults "${DATA_ARGS[@]}" . "${{ runner.temp }}/generated"

      # General template
      - name: Install Nix
        if: matrix.project_type == 'general'
        uses: cachix/install-nix-action@v31

      - name: Check general flake
        if: matrix.project_type == 'general'
        working-directory: "${{ runner.temp }}/generated"
        run: nix flake check

      # Python template
      - name: Set up uv
        if: matrix.project_type == 'python'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - name: Check Python project
        if: matrix.project_type == 'python'
        working-directory: "${{ runner.temp }}/generated"
        run: |
          uv sync
          uv run ruff check .
          uv run pyright
          uv run pytest

      # Rust templates
      - name: Set up Rust
        if: matrix.project_type == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust project
        if: matrix.project_type == 'rust'
        working-directory: "${{ runner.temp }}/generated"
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Node/TypeScript templates
      - name: Get pnpm version
        if: matrix.project_type != 'general' && matrix.project_type != 'python' && matrix.project_type != 'rust'
        id: pnpm-version
        working-directory: "${{ runner.temp }}/generated"
        run: |
          version=$(python3 -c "import json; pm=json.load(open('package.json')).get('packageManager',''); print(pm.replace('pnpm@','').split('+')[0])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Node
        if: matrix.project_type != 'general' && matrix.project_type != 'python' && matrix.project_type != 'rust'
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install pnpm
        if: matrix.project_type != 'general' && matrix.project_type != 'python' && matrix.project_type != 'rust'
        run: npm install -g pnpm@${{ steps.pnpm-version.outputs.version }}

      - name: Get pnpm store directory
        if: matrix.project_type != 'general' && matrix.project_type != 'python' && matrix.project_type != 'rust'
        id: pnpm-cache
        working-directory: "${{ runner.temp }}/generated"
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "LOCK_HASH=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        if: matrix.project_type != 'general' && matrix.project_type != 'python' && matrix.project_type != 'rust'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ steps.pnpm-cache.outputs.LOCK_HASH }}

      - name: Install dependencies
        if: matrix.project_type != 'general' && matrix.project_type != 'python' && matrix.project_type != 'rust'
        working-directory: "${{ runner.temp }}/generated"
        run: pnpm install

      - name: Cache Playwright browsers
        if: matrix.browser_tests == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: matrix.browser_tests == 'true'
        working-directory: "${{ runner.temp }}/generated"
        run: pnpm exec playwright install --with-deps

      - name: Run format
        if: matrix.project_type != 'general' && matrix.project_type != 'python' && matrix.project_type != 'rust'
        working-directory: "${{ runner.temp }}/generated"
        run: pnpm run format

      - name: Run lint
        if: matrix.project_type != 'general' && matrix.project_type != 'python' && matrix.project_type != 'static-worker' && matrix.project_type != 'rust'
        working-directory: "${{ runner.temp }}/generated"
        run: pnpm run lint

      - name: Generate Cloudflare types
        if: matrix.project_type == 'hono-worker' || matrix.project_type == 'sveltekit'
        working-directory: "${{ runner.temp }}/generated"
        run: pnpm run gen:cf-types

      - name: Run typecheck
        if: matrix.project_type != 'general' && matrix.project_type != 'python' && matrix.project_type != 'static-worker' && matrix.project_type != 'rust'
        working-directory: "${{ runner.temp }}/generated"
        run: pnpm run check

      - name: Run build
        if: matrix.project_type != 'general' && matrix.project_type != 'python' && matrix.project_type != 'static-worker' && matrix.project_type != 'rust'
        working-directory: "${{ runner.temp }}/generated"
        run: pnpm run build

      - name: Run tests
        if: matrix.tests == 'true' && matrix.project_type != 'rust'
        working-directory: "${{ runner.temp }}/generated"
        run: pnpm run test
