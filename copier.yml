_min_copier_version: "9.0.0"

_subdirectory: "{{ project_type }}"

name:
    type: str
    help: Project name (kebab-case, used in package names and configs)
    default: "{{ _copier_conf.dst_path.name }}"
    validator: >-
        {% if not (name | regex_search('^[a-z][a-z0-9\-]+$')) %}
        name must start with a letter, followed by one or more letters, digits, or dashes, all lowercase.
        {% endif %}

description:
    type: str
    help: Short description of the project
    default: "A project built with this template"

project_type:
    type: str
    help: What type of project is this?
    choices:
        General-purpose: general
        Python package: python
        Cloudflare Worker (Hono): worker
        SvelteKit app: sveltekit
        Svelte library: svelte-library

tailwind:
    type: bool
    help: Include Tailwind CSS?
    default: "{{ project_type in ['sveltekit', 'svelte-library'] }}"
    when: "{{ project_type in ['sveltekit', 'svelte-library'] }}"

svelte_m3c:
    type: bool
    help: Include Svelte M3C?
    default: false
    when: "{{ tailwind }}"

cli:
    type: bool
    help: Include a CLI entry point?
    default: false
    when: "{{ project_type == 'python' }}"

tests:
    type: bool
    help: Include tests?
    default: true
    when: "{{ project_type in ['worker', 'sveltekit', 'svelte-library'] }}"

browser_tests:
    type: bool
    help: Include Playwright browser tests?
    default: false
    when: "{{ tests and project_type in ['sveltekit', 'svelte-library'] }}"

_message_after_copy: |
    Project "{{ name }}" created successfully!

    Next steps:
    1. cd {{ _copier_conf.dst_path }}
    2. direnv allow  # if using direnv, or: nix develop
    3. {% if project_type == 'python' %}uv sync{% else %}pnpm install{% endif %}
    4. {% if project_type == 'python' %}uv run pytest{% else %}pnpm dev{% endif %}
